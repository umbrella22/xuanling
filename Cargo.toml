# Detached workspace: crates/xuanling-toolkit + crates/xuanling-mcp + npm
# extracted from the monorepo (baseline revision b554bb7bad651c4d6f0c9e5a2c590f4f36d0ac9c).
# npm/scripts/shared.mjs reads the workspace version section from this file, so
# keep that section header and the version field stable.

[workspace]
resolver = "3"
members = [
    "crates/xuanling-toolkit",
    "crates/xuanling-memory",
    "crates/xuanling-mcp",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.27"
libc = "0.2.186"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
time = { version = "0.3.53", features = [
    "formatting",
    "local-offset",
    "parsing",
    "serde",
] }
tokio = { version = "1.52.3", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
uuid = { version = "1.23.4", features = ["serde", "v7"] }

[workspace.lints.clippy]
# Phase 1 baseline clippy rules (P1.1): default lints at warn level. Crates
# opt in via `[lints] workspace = true`.
all = { level = "warn", priority = -1 }
