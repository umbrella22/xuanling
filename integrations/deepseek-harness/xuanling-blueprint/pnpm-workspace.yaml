packages:
  - '.'

# Keep pnpm's build-script policy explicit for the DSH runtime closure. Native
# PTY and Koffi bindings are required by the host probes; the other reviewed
# scripts are deliberately denied because Blueprint does not need them.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  koffi: true
  node-pty: true
  protobufjs: false
