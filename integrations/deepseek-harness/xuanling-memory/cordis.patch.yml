# Recommended XuanLing bundle for DeepSeek Harness.
#
# DSH already has deeply integrated filesystem, shell, web, LSP, and
# orchestration tools. This additive mount exposes only XuanLing's canonical
# Memory v2 workflow while the bundle-owned lazy projection starts from one
# catalog control. The official bridge still owns transport, result projection,
# reconnect, and generation rollback; this wrapper owns model visibility.
# The complete cached memory profile is intentional: proposals, review,
# replacement, archival, feedback, and read/search remain one coherent API.
#
# Production uses XuanLing's shared default memory database. schema-adapter.mjs
# also applies the DSH result projection: duplicate text blocks that repeat
# structuredContent are reduced to one complete block without removing the
# structured value.

- insert:
    - id: xuanling-memory
      name: '@xuanling-rs/xuanling-dsh-memory/lazy-mcp-client.mjs'
      config:
        serverName: xuanling
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.env.XUANLING_DSH_SCHEMA_ADAPTER ?? process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@xuanling-rs/xuanling-dsh-memory/schema-adapter.mjs')
          - '--binary'
          - !!js process.execPath
          - '--'
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@xuanling-rs/xuanling-mcp/bin/xuanling-mcp.js')
          - '--tool-profile'
          - 'memory'
        toolCallTimeoutMs: 120000
