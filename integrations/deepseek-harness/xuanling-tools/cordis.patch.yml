# XuanLing tools for DeepSeek Harness — additive variant.
#
# Mounts the xuanling-mcp binary through the local result adapter and the
# official @deepseek-ai/dsh-mcp-client bridge through a bundle-owned lazy
# wrapper. The bridge caches every XuanLing definition; the wrapper exposes
# mcp_catalog__xuanling first and registers exact activations as native
# mcp__xuanling__<raw> tools. The official bridge still owns reconnect,
# re-sync, and generation rollback. Built-in tools stay registered.
#
# The bundle resolves its exact result adapter and xuanling-mcp dependency from
# the DSH profile. The JS launcher then selects and verifies the matching native
# package; the adapter preserves one complete text projection and structured value.
#
# The filesystem capability root is explicit. XUANLING_WORKSPACE_ROOT must
# name the confirmed absolute workspace; missing configuration fails startup.
# Memory uses the shared default
# database (~/.xuanling/memory.db) exactly like the ZCode plugin deployment.
# The ZCode-only object-parameter compat shim stays OFF everywhere in this
# integration: DeepSeek forwards model arguments as verbatim JSON.

- insert:
    - id: xuanling-tools
      name: '@xuanling-rs/xuanling-dsh-tools/lazy-mcp-client.mjs'
      config:
        serverName: xuanling
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@xuanling-rs/xuanling-dsh-tools/mcp-result-adapter.mjs')
          - '--binary'
          - !!js process.execPath
          - '--'
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@xuanling-rs/xuanling-mcp/bin/xuanling-mcp.js')
          - '--workspace-root'
          - !!js (() => { const root = process.env.XUANLING_WORKSPACE_ROOT; if (!root) throw new Error('XUANLING_WORKSPACE_ROOT is required for the XuanLing full-tools bundle'); return root })()
        toolCallTimeoutMs: 120000
