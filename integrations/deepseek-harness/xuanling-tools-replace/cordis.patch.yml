# XuanLing tools for DeepSeek Harness — compatibility alias.
#
# Releases before this boundary remediation disabled the complete native
# tool-fs row, which also removed read_image and the host observation/editor
# integration. The package now preserves every native row and mounts the same
# lazy XuanLing full catalog as the additive bundle. Existing profiles therefore
# recover native filesystem behavior on update without a destructive migration.
#
# New installs should use @xuanling-rs/xuanling-dsh-tools. This row keeps a
# package-specific id so inventory can detect two XuanLing runtimes explicitly;
# it never relies on Cordis replacement order to express mutual exclusion.

- insert:
    - id: xuanling-tools-replace
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: xuanling
        toolExposure: lazy
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@xuanling-rs/xuanling-dsh-tools-replace/mcp-result-adapter.mjs')
          - '--binary'
          - !!js process.execPath
          - '--'
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@xuanling-rs/xuanling-mcp/bin/xuanling-mcp.js')
          - '--workspace-root'
          - !!js (() => { const root = process.env.XUANLING_WORKSPACE_ROOT; if (!root) throw new Error('XUANLING_WORKSPACE_ROOT is required for the XuanLing full-tools compatibility bundle'); return root })()
        toolCallTimeoutMs: 120000
