# XuanLing filesystem replacement for DeepSeek Harness.
#
# The native tool-fs row is disabled because it occupies read/write/edit and
# read_image as one plugin. The facade privately mounts the official MCP bridge,
# projects XuanLing text operations under host-native names, and selectively
# re-registers the native read_image definition. The host fs service,
# observation policy, ToolRuntime, ApprovalService, and UI presenters remain in
# place. This package is opt-in and must not be combined with the additive
# XuanLing tools bundle.

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: true

- insert:
    - id: xuanling-tools-replace
      name: '@xuanling-rs/xuanling-dsh-tools-replace/filesystem-facade.mjs'
      config:
        serverName: xuanling
        workspaceRoot: !!js (() => { const root = process.env.XUANLING_WORKSPACE_ROOT; if (!root) throw new Error('XUANLING_WORKSPACE_ROOT is required for the XuanLing filesystem replacement bundle'); return root })()
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@xuanling-rs/xuanling-dsh-tools-replace/mcp-result-adapter.mjs')
          - '--binary'
          - !!js process.execPath
          - '--'
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@xuanling-rs/xuanling-mcp/bin/xuanling-mcp.js')
          - '--workspace-root'
          - !!js (() => { const root = process.env.XUANLING_WORKSPACE_ROOT; if (!root) throw new Error('XUANLING_WORKSPACE_ROOT is required for the XuanLing filesystem replacement bundle'); return root })()
        toolCallTimeoutMs: 120000
