[package]
name = "xuanling-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
# SQLite-only SQLx, package-local (plan §3.1): do NOT inherit the workspace
# sqlx (which carries postgres + tls). This keeps the dependency island small.
sqlx = { version = "0.9.0", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite-bundled",
    "time",
] }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
unicode-normalization = "0.1"

# Semantic embedding is deliberately NOT a default capability (plan W6, C-07):
# the default build must carry no model runtime, downloader, or network stack.
# This feature only exposes the protocol-neutral `Embedder` trait and its
# deterministic test double — no real model adapter ships with the crate.
[features]
default = []
experimental-embeddings = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
