name: publish-xuanling-mcp-to-npm

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a no-publish release candidate build, or only the default preflight"
        required: false
        default: preflight
        type: choice
        options:
          - preflight
          - candidate
  push:
    tags:
      - "xuanling-mcp-v*"

permissions:
  contents: read

concurrency:
  group: xuanling-mcp-npm-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    name: validate release tag and source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install supported npm CLI
        run: npm install --global npm@11.6.2
      - id: version
        name: Validate release source and repository versions
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION=${GITHUB_REF_NAME#xuanling-mcp-v}
            if [ "xuanling-mcp-v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "invalid release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/main" || {
              echo "manual release preflight must run from main" >&2
              exit 1
            }
            test "$COMMIT" = "$(git rev-parse origin/main)" || {
              echo "manual release preflight must use the current origin/main commit" >&2
              exit 1
            }
            VERSION=$(node -p "require('./npm/packages/xuanling-mcp/package.json').version")
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must contain a stable semver version: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "release tag commit $COMMIT is not merged into origin/main" >&2
            exit 1
          fi
          XUANLING_VERSION="$VERSION" node npm/scripts/check-version.mjs
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify canonical repository
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="git+https://github.com/umbrella22/xuanling.git"
          ACTUAL=$(node -p "require('./npm/packages/xuanling-mcp/package.json').repository.url")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "publish refused: repository.url is '$ACTUAL', expected '$EXPECTED'" >&2
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY:-}" != "umbrella22/xuanling" ]; then
            echo "publish refused: running in '${GITHUB_REPOSITORY:-<unknown>}'" >&2
            exit 1
          fi
      - name: Run release contract tests
        working-directory: npm
        run: npm test

  npm-prerequisites:
    name: verify npm ownership and release prerequisites
    needs: validate-release
    runs-on: ubuntu-latest
    environment: npmjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install supported npm CLI
        run: npm install --global npm@11.6.2
      - name: Check package-name release requirements without publishing
        run: node npm/scripts/check-release-prerequisites.mjs

  zcode-prerequisites:
    name: verify ZCode target identity and push permission
    needs: validate-release
    runs-on: ubuntu-latest
    environment: zcode-packer
    steps:
      - name: Require exact Environment configuration
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ vars.ZCODE_REPOSITORY }}
          XL_PUBLISH_TOKEN: ${{ secrets.XL_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "umbrella22/xuanling" || {
            echo "promotion refused from unexpected source repository: $GITHUB_REPOSITORY" >&2
            exit 1
          }
          test "$TARGET_REPOSITORY" = "umbrella22/xuanling-zcode-marketplace" || {
            echo "ZCODE_REPOSITORY must be umbrella22/xuanling-zcode-marketplace" >&2
            exit 1
          }
          test -n "$XL_PUBLISH_TOKEN" || {
            echo "XL_PUBLISH_TOKEN is not configured in zcode-packer" >&2
            exit 1
          }
      - name: Verify authenticated target repository access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.XL_PUBLISH_TOKEN }}
          TARGET_REPOSITORY: ${{ vars.ZCODE_REPOSITORY }}
        run: |
          set -euo pipefail
          REPOSITORY=$(gh api "repos/$TARGET_REPOSITORY")
          test "$(jq -r .full_name <<<"$REPOSITORY")" = "$TARGET_REPOSITORY" || {
            echo "authenticated target repository identity mismatch" >&2
            exit 1
          }
          test "$(jq -r .default_branch <<<"$REPOSITORY")" = "main" || {
            echo "target default branch must be main" >&2
            exit 1
          }
          test "$(jq -r '.permissions.push // false' <<<"$REPOSITORY")" = "true" || {
            echo "XL_PUBLISH_TOKEN does not have target contents push permission" >&2
            exit 1
          }

  build-main:
    name: build npm launcher tarball
    needs: [validate-release, npm-prerequisites, zcode-prerequisites]
    if: github.event_name == 'push' || inputs.mode == 'candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install supported npm CLI
        run: npm install --global npm@11.6.2
      - name: Stage, verify, and pack launcher
        run: |
          node npm/scripts/stage-main.mjs \
            --out npm/dist/main/package \
            --commit "${{ needs.validate-release.outputs.commit }}"
          node npm/scripts/verify-package.mjs --main npm/dist/main/package
          node npm/scripts/pack-package.mjs \
            --package npm/dist/main/package \
            --out npm/dist/main/pack \
            --label main \
            --kind main
      - uses: actions/upload-artifact@v4
        with:
          name: npm-main
          path: npm/dist/main/pack
          if-no-files-found: error
          retention-days: 7

  build-native:
    name: build npm native tarball (${{ matrix.target_id }})
    needs: [validate-release, npm-prerequisites, zcode-prerequisites]
    if: github.event_name == 'push' || inputs.mode == 'candidate'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_id: linux-x64-gnu
            rust_target: x86_64-unknown-linux-gnu
            binary: xuanling-mcp
          - os: macos-latest
            target_id: darwin-arm64
            rust_target: aarch64-apple-darwin
            binary: xuanling-mcp
          - os: windows-latest
            target_id: win32-x64-msvc
            rust_target: x86_64-pc-windows-msvc
            binary: xuanling-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install supported npm CLI
        run: npm install --global npm@11.6.2
      - name: Build locked release binary
        run: cargo build --locked --release --target ${{ matrix.rust_target }} -p xuanling-mcp
      - name: Smoke native MCP protocol
        shell: bash
        run: |
          node npm/scripts/smoke-mcp.mjs \
            --binary "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}"
      - name: Stage native package with explicit release trust
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "npm/dist/${{ matrix.target_id }}"
          node npm/scripts/generate-third-party-licenses.mjs \
            --target "${{ matrix.rust_target }}" \
            --output "npm/dist/${{ matrix.target_id }}/THIRD_PARTY_LICENSES.txt"
          node npm/scripts/stage-platform.mjs \
            --target "${{ matrix.target_id }}" \
            --binary "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" \
            --notices "npm/dist/${{ matrix.target_id }}/THIRD_PARTY_LICENSES.txt" \
            --out "npm/dist/${{ matrix.target_id }}/package" \
            --commit "${{ needs.validate-release.outputs.commit }}"
          node npm/scripts/verify-package.mjs \
            --platform "npm/dist/${{ matrix.target_id }}/package" \
            --target "${{ matrix.target_id }}" \
            --version "${{ needs.validate-release.outputs.version }}" \
            --require-release-trust
          node npm/scripts/pack-package.mjs \
            --package "npm/dist/${{ matrix.target_id }}/package" \
            --out "npm/dist/${{ matrix.target_id }}/pack" \
            --label "${{ matrix.target_id }}" \
            --kind platform
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target_id }}
          path: npm/dist/${{ matrix.target_id }}/pack
          if-no-files-found: error
          retention-days: 7

  build-dsh:
    name: build four DSH bundle tarballs
    needs: [validate-release, npm-prerequisites, zcode-prerequisites]
    if: github.event_name == 'push' || inputs.mode == 'candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install supported npm CLI
        run: npm install --global npm@11.6.2
      - name: Pack and verify DSH bundles
        run: |
          node npm/scripts/pack-dsh-bundles.mjs \
            --out npm/dist/dsh \
            --commit "${{ needs.validate-release.outputs.commit }}"
          node npm/scripts/verify-dsh-release-set.mjs \
            --root npm/dist/dsh \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-bundles
          path: npm/dist/dsh
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    name: verify complete release set and build ZCode projection
    needs: [validate-release, build-main, build-native, build-dsh]
    if: github.event_name == 'push' || inputs.mode == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install supported npm CLI
        run: npm install --global npm@11.6.2
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm/release
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: dsh-bundles
          path: npm/dsh-release
      - name: Verify all core release trust and DSH artifacts
        run: |
          node npm/scripts/verify-release-set.mjs \
            --root npm/release \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}" \
            --require-release-trust
          node npm/scripts/verify-dsh-release-set.mjs \
            --root npm/dsh-release \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}"
      - name: Generate and verify immutable ZCode marketplace artifact
        run: |
          node npm/scripts/stage-zcode-marketplace.mjs \
            --release-root npm/release \
            --out npm/dist/zcode/marketplace \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}" \
            --require-release-trust
          node npm/scripts/verify-zcode-marketplace.mjs \
            --root npm/dist/zcode/marketplace \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}" \
            --require-release-trust
      - name: Attest immutable ZCode marketplace archive
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: npm/dist/zcode/xuanling-zcode-marketplace-${{ needs.validate-release.outputs.version }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: zcode-marketplace
          path: |
            npm/dist/zcode/zcode-marketplace.pack.json
            npm/dist/zcode/xuanling-zcode-marketplace-${{ needs.validate-release.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ordered npm release set
    needs: [validate-release, assemble-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npmjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.6.2
      - name: Verify GitHub OIDC publish environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "npm Trusted Publishing requires ACTIONS_ID_TOKEN_REQUEST_URL" >&2
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "npm Trusted Publishing requires ACTIONS_ID_TOKEN_REQUEST_TOKEN" >&2
            exit 1
          }
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm/release
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: dsh-bundles
          path: npm/dsh-release
      - uses: actions/download-artifact@v4
        with:
          name: zcode-marketplace
          path: npm/zcode-release
      - name: Reverify exact release bytes before publishing
        run: |
          node npm/scripts/materialize-zcode-marketplace.mjs \
            --artifact-root npm/zcode-release \
            --out npm/zcode-release/marketplace \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}"
          node npm/scripts/verify-release-set.mjs \
            --root npm/release \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}" \
            --require-release-trust
          node npm/scripts/verify-dsh-release-set.mjs \
            --root npm/dsh-release \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}"
          node npm/scripts/verify-zcode-marketplace.mjs \
            --root npm/zcode-release/marketplace \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}" \
            --require-release-trust
      - name: Publish scoped native variants
        run: |
          set -euo pipefail
          for TARGET in darwin-arm64 linux-x64-gnu win32-x64-msvc; do
            node npm/scripts/publish-idempotent.mjs \
              --manifest "npm/release/npm-$TARGET/$TARGET.pack.json" \
              --tag "platform-$TARGET"
          done
      - name: Publish scoped stable launcher
        run: |
          node npm/scripts/publish-idempotent.mjs \
            --manifest npm/release/npm-main/main.pack.json \
            --tag latest
      - name: Publish scoped DSH bundles
        run: |
          set -euo pipefail
          for PACKAGE in \
            xuanling-dsh-memory \
            xuanling-dsh-skills \
            xuanling-dsh-tools \
            xuanling-dsh-tools-replace; do
            node npm/scripts/publish-idempotent.mjs \
              --manifest "npm/dsh-release/$PACKAGE/$PACKAGE.pack.json" \
              --tag latest
          done
      - name: Reconcile all eight scoped immutable registry items
        run: |
          node npm/scripts/verify-published-release.mjs \
            --core-root npm/release \
            --dsh-root npm/dsh-release \
            --version "${{ needs.validate-release.outputs.version }}"

  promote:
    name: directly promote verified ZCode marketplace
    needs: [validate-release, publish, zcode-prerequisites]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: zcode-packer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install supported npm CLI
        run: npm install --global npm@11.6.2
      - name: Revalidate exact target identity and push permission
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.XL_PUBLISH_TOKEN }}
          TARGET_REPOSITORY: ${{ vars.ZCODE_REPOSITORY }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "umbrella22/xuanling-zcode-marketplace"
          test -n "$GH_TOKEN"
          REPOSITORY=$(gh api "repos/$TARGET_REPOSITORY")
          test "$(jq -r .full_name <<<"$REPOSITORY")" = "$TARGET_REPOSITORY"
          test "$(jq -r .default_branch <<<"$REPOSITORY")" = "main"
          test "$(jq -r '.permissions.push // false' <<<"$REPOSITORY")" = "true"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ZCODE_REPOSITORY }}
          ref: main
          fetch-depth: 0
          path: target
          token: ${{ secrets.XL_PUBLISH_TOKEN }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm/release
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: dsh-bundles
          path: npm/dsh-release
      - uses: actions/download-artifact@v4
        with:
          name: zcode-marketplace
          path: npm/zcode-release
      - name: Reconcile registry and ZCode artifact before promotion
        run: |
          node npm/scripts/materialize-zcode-marketplace.mjs \
            --artifact-root npm/zcode-release \
            --out npm/zcode-release/marketplace \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}"
          node npm/scripts/verify-published-release.mjs \
            --core-root npm/release \
            --dsh-root npm/dsh-release \
            --version "${{ needs.validate-release.outputs.version }}"
          node npm/scripts/verify-zcode-marketplace.mjs \
            --root npm/zcode-release/marketplace \
            --version "${{ needs.validate-release.outputs.version }}" \
            --commit "${{ needs.validate-release.outputs.commit }}" \
            --require-release-trust
      - name: Promote or verify immutable target tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-release.outputs.version }}"
          SOURCE_COMMIT="${{ needs.validate-release.outputs.commit }}"
          TREE_SHA256=$(node -p "require('./npm/zcode-release/zcode-marketplace.pack.json').tree_sha256")
          TAG="xuanling-mcp-v$VERSION"
          INCOMING="$GITHUB_WORKSPACE/npm/zcode-release/marketplace"

          git -C target fetch --force --tags origin
          if git -C target rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            EXISTING="$RUNNER_TEMP/existing-zcode-tag"
            git -C target worktree add --detach "$EXISTING" "$TAG"
            trap 'git -C target worktree remove --force "$EXISTING"' EXIT
            node npm/scripts/promote-zcode-marketplace.mjs \
              --incoming "$INCOMING" \
              --target "$EXISTING" \
              --version "$VERSION" \
              --source-commit "$SOURCE_COMMIT" \
              --tree-sha256 "$TREE_SHA256" \
              --mode compare-only
            exit 0
          fi

          node npm/scripts/promote-zcode-marketplace.mjs \
            --incoming "$INCOMING" \
            --target "$GITHUB_WORKSPACE/target" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --tree-sha256 "$TREE_SHA256" \
            --mode promote
          git -C target config user.name "xuanling-release[bot]"
          git -C target config user.email "xuanling-release[bot]@users.noreply.github.com"
          git -C target add marketplace.json plugins release-manifest.json
          if ! git -C target diff --cached --quiet; then
            git -C target commit -m "release: promote XuanLing MCP $VERSION"
          fi
          git -C target tag "$TAG"
          git -C target push --atomic origin \
            "HEAD:refs/heads/main" \
            "refs/tags/$TAG"
